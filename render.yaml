# Render Blueprint for the EduNext backend (Express + libSQL/Turso).
# This repo (pinnacle-edunext) holds the EduNext app in the `edunext/` subfolder,
# so the build context is set with `rootDir: edunext`.
#
# Persistence: set TURSO_DATABASE_URL + TURSO_AUTH_TOKEN below (sync:false — you
# paste them from the Turso dashboard). With Turso, the free-tier restart no
# longer wipes accounts — data lives in Turso, not on the container's disk.
#
# Validate at https://render.com/docs/blueprint-spec
services:
  - type: web
    name: edunext-api
    runtime: node
    plan: free
    region: singapore # closest offered to India
    rootDir: edunext
    buildCommand: npm install
    startCommand: npm run start -w @edunext/backend
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true # Render generates a strong secret
      - key: CORS_ORIGINS
        sync: false # YOU fill this in with the Vercel URL (no trailing slash)
      # --- Turso (persistent database) — paste these from the Turso dashboard ---
      - key: TURSO_DATABASE_URL
        sync: false # libsql://<your-db>.turso.io
      - key: TURSO_AUTH_TOKEN
        sync: false # the auth token you created for the database
      - key: LOG_LEVEL
        value: info
    # DATABASE_PATH is only used if TURSO_DATABASE_URL is unset (local file,
    # ephemeral). The old persistent-disk block is obsolete now that Turso holds
    # the data; delete the disk if you added one previously.
